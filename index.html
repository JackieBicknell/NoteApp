<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="note.js" defer></script>
    <link rel="stylesheet" href="Style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@100;400&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class="paper">
        <h1>NotePad</h1>
        <div class="note">
            <h2>Add a note</h2>
            <form action="AddNote()">
                <label for="noteHeader">Subject:</label>
                <input type="text" name="header" id="noteHeader" autocomplete="off" autocapitalize="words">
                <textarea id="newNoteArea" title="newNote" placeholder="Add note" autocomplete="off" autocapitalize="words"></textarea>
                <input type="button" title="delete button" value="Submit" id="btnAddNote" onClick="addNote()">
            </form>
        </div>
        <div id="allNotes"></div>
    </div>
</body>
</html>
